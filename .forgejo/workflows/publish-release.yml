name: Publish Release

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Merged release pull request number"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and tag the merged release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact merged release
        id: release
        env:
          PR: ${{ inputs.pull_request }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Enter the merged release PR number"; exit 1; }
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          forge() {
            printf 'Authorization: token %s\n' "$TOKEN" | curl -fsS --max-time 30 -H @- "$@"
          }
          pr=$(forge "$api/pulls/$PR")
          verified=$(python3 -I .forgejo/scripts/verify-release-pr.py "$GITHUB_REPOSITORY" "$PR" <<< "$pr")
          candidate=$(jq -er '.candidate' <<< "$verified")
          channel=$(jq -er '.channel' <<< "$verified")
          qualification=$(forge "$api/commits/$candidate/status?limit=50")
          run=$(python3 -I .forgejo/scripts/qualified-run.py "$GITHUB_REPOSITORY" <<< "$qualification") \
            || { echo "::error::This PR head did not pass Prepare Release"; exit 1; }
          runs=$(forge "$api/actions/runs?page=1&limit=1&run_number=$run")
          run_id=$(jq -er --arg channel "$channel" '
            .workflow_runs[0] | select(.workflow_id == "release.yml" and .status == "success"
            and .trigger_event == "workflow_dispatch"
            and (.event_payload | fromjson | .ref == "refs/heads/main" and .inputs.channel == $channel)) | .id
          ' <<< "$runs") || { echo "::error::No successful Prepare Release run for this candidate"; exit 1; }
          jobs=$(forge "$api/actions/runs/$run_id/jobs")
          job=$(jq -er '.[] | select(.name == "Open the qualified release PR" and .status == "success") | .id' <<< "$jobs")
          log=$(forge "$api/actions/jobs/$job/logs")
          grep -F "Qualified release commit: $candidate" <<< "$log" >/dev/null \
            || { echo "::error::Prepare Release did not produce this candidate"; exit 1; }
          jq -r '"tag=" + .tag, "commit=" + .commit' <<< "$verified" >> "$GITHUB_OUTPUT"

      - name: Push only the verified release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_COMMIT: ${{ steps.release.outputs.commit }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          ref="refs/tags/$TAG"
          if ! git show-ref --verify --quiet "$ref"; then
            git -c user.name='forgejo-actions[bot]' \
              -c user.email='forgejo-actions[bot]@users.noreply.bryantserver.com' \
              tag -a -m "release: $TAG" "$TAG" "$MERGE_COMMIT"
          fi
          [ "$(git cat-file -t "$ref")" = tag ]
          [ "$(git rev-parse "$ref^{commit}")" = "$MERGE_COMMIT" ]
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_VALUE_0="Authorization: Basic $basic"
          git push origin "$ref:$ref"
          peeled=$(git ls-remote --exit-code origin "$ref^{}" | cut -f1)
          [ "$peeled" = "$MERGE_COMMIT" ]
