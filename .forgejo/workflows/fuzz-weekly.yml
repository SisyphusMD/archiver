name: Fuzz weekly

# The parsers fuzzed at length (ADR 39): the per-change job gives each target 30 seconds,
# this one ten minutes, weekly and on demand. Advisory: a crash fails this run for someone to
# turn into a regression test, and blocks nothing.
on:
  schedule:
    - cron: '41 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz every target, ten minutes each
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fuzz
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=golang
          GO_IMAGE=golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d
          tar -c . | docker run --rm -i -e GOPROXY=https://artifacts.nas.bryantserver.com/proxy.golang.org,direct -e FUZZTIME=10m --entrypoint sh "$GO_IMAGE" -c \
            'mkdir /w && cd /w && tar -x && sh tests/fuzz.sh'
