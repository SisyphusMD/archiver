name: Scan weekly

# Known vulnerabilities in the newest released image, weekly and on demand (ADR 40).
# Advisory: it reports, and fails nothing; most findings are Debian packages with no fix yet.
on:
  schedule:
    - cron: '23 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: trivy, newest release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        env:
          REGISTRY_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          TRIVY_USERNAME: cody
          TRIVY_PASSWORD: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:3cee4b44cb54d59f5b8822f8ca6379d6aafa4308834e5d9d958f5a4dc553a428
          # renovate: datasource=docker depName=aquasec/trivy
          TRIVY_IMAGE=aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          repo=forgejo.bryantserver.com/sisyphusmd/archiver
          AUTH=skopeo-auth-scan-${{ github.run_id }}
          trap 'docker volume rm -f "$AUTH" >/dev/null 2>&1' EXIT
          bash .forgejo/scripts/registry-auth.sh "$AUTH" "$SKOPEO_IMAGE" forgejo.bryantserver.com=cody:REGISTRY_PAT
          newest=$(docker run --rm -v "$AUTH":/auth:ro "$SKOPEO_IMAGE" list-tags --authfile /auth/auth.json "docker://$repo" \
            | python3 -c '
          import json, re, sys
          # SemVer order: a release sorts after its own prereleases (1.0.0 > 1.0.0-rc.1).
          def key(t):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.]+))?", t)
              pre = [(0, int(p), "") if p.isdigit() else (1, 0, p) for p in m.group(4).split(".")] if m.group(4) else None
              return (int(m.group(1)), int(m.group(2)), int(m.group(3)), pre is None, pre or [])
          tags = [t for t in json.load(sys.stdin)["Tags"] if re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?", t) and not t.endswith("-slim")]
          print(max(tags, key=key))
          ')
          echo "Scanning $repo:$newest"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 0 "$repo:$newest"
