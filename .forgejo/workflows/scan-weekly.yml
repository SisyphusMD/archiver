name: Scan weekly

# Known vulnerabilities in the newest released image, weekly and on demand (ADR 40).
# Advisory: it reports, and fails nothing; most findings are Debian packages with no fix yet.
on:
  schedule:
    - cron: '23 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: trivy, newest release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan
        env:
          REGISTRY_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:e5d5d2815b94d74767d40be7111647c3e9cdc84406a638ffe1c7ea1f286f52a3
          # renovate: datasource=docker depName=aquasec/trivy
          TRIVY_IMAGE=aquasec/trivy:0.69.1@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73
          repo=forgejo.bryantserver.com/sisyphusmd/archiver
          newest=$(docker run --rm -e REGISTRY_PAT --entrypoint sh "$SKOPEO_IMAGE" -c 'skopeo list-tags --creds "cody:$REGISTRY_PAT" "docker://$0"' "$repo" \
            | python3 -c '
          import json, re, sys
          # SemVer order: a release sorts after its own prereleases (1.0.0 > 1.0.0-rc.1).
          def key(t):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.]+))?", t)
              pre = [(0, int(p), "") if p.isdigit() else (1, 0, p) for p in m.group(4).split(".")] if m.group(4) else None
              return (int(m.group(1)), int(m.group(2)), int(m.group(3)), pre is None, pre or [])
          tags = [t for t in json.load(sys.stdin)["Tags"] if re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?", t) and not t.endswith("-slim")]
          print(max(tags, key=key))
          ')
          echo "Scanning $repo:$newest"
          docker run --rm -e TRIVY_USERNAME=cody -e TRIVY_PASSWORD="$REGISTRY_PAT" "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 0 "$repo:$newest"
