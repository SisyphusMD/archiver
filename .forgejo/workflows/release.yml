name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
      skip_real_backends:
        description: 'Release without the real-service round trips (only for an outside service outage; the release notes say so)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"

      # The branch rules live in the script, tested by tests/next_version.bats: main cuts 0.x
      # releases until its first 1.0.0 alpha, then alphas and 1.0.0; release/<major>.<minor>
      # cuts that line's patches. The bump commit is pushed back to the dispatching branch.
      - name: Compute next version
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          NEXT=$(bash .forgejo/scripts/next-version.sh "$BRANCH" "$BUMP")
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${NEXT} from ${BRANCH} (bump=${BUMP}, previous=${PREV_TAG:-none})"

      - name: Sanity guards
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qE '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Missing '## [Unreleased]' section"
            exit 1
          fi
          if grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG already has a [${VERSION}] section"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

      - name: Detect dependency commits since previous tag
        id: deps
        env:
          PREV: ${{ steps.ver.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          DEPS=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^(chore|fix)\(deps\):' || true)
          if [ -z "$DEPS" ]; then
            echo "No dependency commits since ${PREV:-beginning}"
            {
              echo 'deps<<DEPS_EOF'
              echo 'DEPS_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "Detected dependency commits:"
            echo "$DEPS"
            {
              echo 'deps<<DEPS_EOF'
              echo "$DEPS"
              echo 'DEPS_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Promote [Unreleased] and append dependencies
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEPS: ${{ steps.deps.outputs.deps }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          # ENVIRON["DEPS"] avoids awk's -v backslash-escape processing,
          # which would corrupt subjects containing backslashes.
          awk -v ver="$VERSION" -v date="$DATE" '
            BEGIN { in_section = 0; emitted = 0; deps = ENVIRON["DEPS"] }
            /^## \[Unreleased\]/ {
              suffix = $0
              sub(/^## \[Unreleased\]/, "", suffix)
              print "## [Unreleased]"
              print ""
              print "## [" ver "] - " date suffix
              in_section = 1
              next
            }
            in_section && /^## \[/ {
              if (!emitted && deps != "") {
                print "### Dependencies"
                print ""
                n = split(deps, lines, "\n")
                for (i = 1; i <= n; i++) if (lines[i] != "") print "- " lines[i]
                print ""
                emitted = 1
              }
              in_section = 0
              print
              next
            }
            { print }
            END {
              if (in_section && !emitted && deps != "") {
                print ""
                print "### Dependencies"
                print ""
                n = split(deps, lines, "\n")
                for (i = 1; i <= n; i++) if (lines[i] != "") print "- " lines[i]
              }
            }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      # An alpha leaves the documented image on the newest stable release (ADR 9).
      - name: Bump image tag in compose.yaml, README, and guides
        if: inputs.bump != 'alpha'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s|(forgejo\.bryantserver\.com/sisyphusmd/archiver:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|g" \
            compose.yaml README.md docs/guides/migration/legacy-to-docker.md docs/guides/configuration/local-storage-setup.md

      - name: Show diff
        run: git --no-pager diff

      # Build + smoke test BEFORE committing the release. A failure here aborts
      # the release cleanly: no commit, no tag, no stranded artifacts. The
      # multi-arch publish in docker-publish.yml trusts this gate.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.nas.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.nas.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.nas.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.nas.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.nas.bryantserver.com/public.ecr.aws"]
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-test:local
          build-args: |
            GOPROXY=https://artifacts.nas.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.nas.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.nas.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.nas.bryantserver.com/download.docker.com
      - name: Smoke test
        run: |
          set +e
          # Run the entrypoint with no config at all: `prepare_config()` exits 1 with the
          # no-keys error — confirms the image boots, sources lib code without import
          # errors, and reaches the config gate. Then assert a bundle-era BUNDLE_PASSWORD
          # refuses (ADR 22). Mirrors docker-publish.yml's pr-validate smoke.
          # `--network none` bounds blast radius for the smoke run.
          OUT=$(docker run --rm --network none smoke-test:local 2>&1)
          RC=$?
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "::error::Container exited 0; expected non-zero (no keys)"
            exit 1
          fi
          if ! echo "$OUT" | grep -q "no RSA key files found"; then
            echo "::error::Expected 'no RSA key files found' in output"
            exit 1
          fi
          OUT2=$(docker run --rm --network none -e BUNDLE_PASSWORD=x smoke-test:local 2>&1)
          RC2=$?
          echo "$OUT2"
          if [ "$RC2" -eq 0 ]; then
            echo "::error::Container exited 0 with BUNDLE_PASSWORD in env; expected non-zero"
            exit 1
          fi
          if ! echo "$OUT2" | grep -q "no longer reads bundles"; then
            echo "::error::Expected the bundle refusal message"
            exit 1
          fi
          echo "Smoke test passed"

      # ADR 27: a release first proves the backends without an emulator still work against
      # their real services. A failure stops the release before anything is tagged.
      - name: Real-service round trips
        if: ${{ !inputs.skip_real_backends }}
        env:
          IMAGE: smoke-test:local
          NIGHTLY_RSA_KEY: ${{ secrets.NIGHTLY_RSA_KEY }}
          NIGHTLY_B2: ${{ secrets.NIGHTLY_B2 }}
          NIGHTLY_B2_CUSTOM: ${{ secrets.NIGHTLY_B2_CUSTOM }}
          NIGHTLY_GCD: ${{ secrets.NIGHTLY_GCD }}
          NIGHTLY_ONE: ${{ secrets.NIGHTLY_ONE }}
          NIGHTLY_ODB: ${{ secrets.NIGHTLY_ODB }}
          NIGHTLY_DROPBOX: ${{ secrets.NIGHTLY_DROPBOX }}
          NIGHTLY_STORJ: ${{ secrets.NIGHTLY_STORJ }}
          NIGHTLY_FABRIC: ${{ secrets.NIGHTLY_FABRIC }}
          NIGHTLY_AZURE: ${{ secrets.NIGHTLY_AZURE }}
          NIGHTLY_GCS: ${{ secrets.NIGHTLY_GCS }}
          NIGHTLY_WASABI: ${{ secrets.NIGHTLY_WASABI }}
        run: |
          # Until the test accounts exist there is nothing to run against.
          if [ -z "$NIGHTLY_RSA_KEY" ]; then
            echo "::warning::No real-service test accounts are configured yet (NIGHTLY_RSA_KEY); round trips not run"
            exit 0
          fi
          bash tests/integration/real-backends.sh

      - name: Record a release without the real-service round trips
        if: ${{ inputs.skip_real_backends }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            { print }
            !done && index($0, "## [" ver "]") == 1 {
              print ""
              print "### Notes"
              print ""
              print "- Released without the real-service round trips (ADR 27): an outside service was failing at release time."
              done = 1
            }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          grep -A4 "## \[$VERSION\]" CHANGELOG.md

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          git add CHANGELOG.md compose.yaml README.md docs/guides/migration/legacy-to-docker.md docs/guides/configuration/local-storage-setup.md
          git commit -m "release: ${VERSION}"
          git tag "${TAG}"
          # Pass the token via http.extraheader (HTTP Authorization header) instead
          # of embedding it in the remote URL. Avoids token leakage in git's error
          # output, which prints the URL on auth failures. Works around the
          # actions/checkout@v6 + forgejo-runner extraheader quirk (#2321) by
          # setting the header explicitly per-command.
          AUTH_B64=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=Authorization: Basic ${AUTH_B64}" \
            push origin "HEAD:${{ github.ref_name }}"
          git -c "http.extraheader=Authorization: Basic ${AUTH_B64}" \
            push origin "${TAG}"
