name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release target (main or release/N.M)"
        default: main
        type: string
        required: true
      bump:
        description: "Version bump"
        type: choice
        required: true
        options: [patch, minor, major, alpha, rc]
      issue:
        description: "Forgejo release issue number"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify the release tree
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      version: ${{ steps.candidate.outputs.version }}
      date: ${{ steps.candidate.outputs.date }}
      intent: ${{ steps.candidate.outputs.intent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the release candidate
        id: candidate
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          [[ "$CHANNEL" =~ ^(main|release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]
          [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
          git fetch --tags origin "refs/heads/$CHANNEL"
          base=$(git rev-parse FETCH_HEAD)
          script="$PWD/.forgejo/scripts/prepare-release-tree.sh"
          git worktree add --detach "$RUNNER_TEMP/release-tree" "$base"
          cd "$RUNNER_TEMP/release-tree"
          release_date=$(date -u +%Y-%m-%d)
          version=$(bash "$script" "$CHANNEL" "$BUMP" "$release_date")
          intent=$(git diff --binary | sha256sum | cut -d' ' -f1)
          printf 'base=%s\nversion=%s\ndate=%s\nintent=%s\n' "$base" "$version" "$release_date" "$intent" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/release-tree
          platforms: linux/amd64
          load: true
          tags: smoke-test:local
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      - name: Smoke test the channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          no_keys="no RSA key files found"
          rejected="no longer reads bundles"
          if [ "$CHANNEL" = release/0.11 ]; then
            no_keys="no bundle and no RSA key files found"
            rejected="BUNDLE_PASSWORD is no longer read from the environment"
          fi
          if output=$(docker run --rm --network none smoke-test:local 2>&1); then
            echo "::error::Expected the no-keys failure"
            exit 1
          fi
          grep -F "$no_keys" <<< "$output"
          if output=$(docker run --rm --network none -e BUNDLE_PASSWORD=x smoke-test:local 2>&1); then
            echo "::error::Expected the bundle-password failure"
            exit 1
          fi
          grep -F "$rejected" <<< "$output"

  prepare:
    name: Open the qualified release PR
    if: github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the qualified release
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
          BASE: ${{ needs.qualify.outputs.base }}
          VERSION: ${{ needs.qualify.outputs.version }}
          DATE: ${{ needs.qualify.outputs.date }}
          INTENT: ${{ needs.qualify.outputs.intent }}
        run: |
          set -euo pipefail
          [[ "$CHANNEL" =~ ^(main|release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ && "$BASE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --tags origin "refs/heads/$CHANNEL"
          [ "$(git rev-parse FETCH_HEAD)" = "$BASE" ] || { echo "::error::Release target advanced"; exit 1; }
          script="$PWD/.forgejo/scripts/prepare-release-tree.sh"
          git worktree add --detach "$RUNNER_TEMP/release-tree" "$BASE"
          cd "$RUNNER_TEMP/release-tree"
          [ "$(bash "$script" "$CHANNEL" "$BUMP" "$DATE")" = "$VERSION" ]
          [ "$(git diff --binary | sha256sum | cut -d' ' -f1)" = "$INTENT" ]
          git -c user.name='forgejo-actions[bot]' \
            -c user.email='forgejo-actions[bot]@users.noreply.bryantserver.com' \
            commit -am "release: $VERSION ($BUMP on $CHANNEL)"

      - name: Open the release pull request
        env:
          TAG: v${{ needs.qualify.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ISSUE: ${{ inputs.issue }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-tree"
          : "${TOKEN:?missing repository write token}"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          forge() {
            printf 'Authorization: token %s\n' "$TOKEN" | curl -fsS --max-time 30 -H @- "$@"
          }
          issue_response=$(printf 'Authorization: token %s\n' "$ISSUE_TOKEN" \
            | curl -fsS --max-time 30 -H @- "$api/issues/$ISSUE")
          jq -e '.state == "open" and .pull_request == null' <<< "$issue_response" >/dev/null \
            || { echo "::error::Select an open release issue"; exit 1; }

          branch="release/$TAG"
          remote_ref="refs/heads/$branch"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_VALUE_0="Authorization: Basic $basic"
          base=$(git rev-parse HEAD^)
          remote_main=$(git ls-remote --exit-code origin "refs/heads/$CHANNEL" | cut -f1)
          [ "$remote_main" = "$base" ] \
            || { echo "::error::The release target moved during qualification. Run Prepare Release again."; exit 1; }
          # A previous attempt may have pushed the same qualified tree before the PR request failed.
          # Compare the existing commit before reusing it. An unrelated branch never gets replaced.
          advertised=$(git ls-remote origin "$remote_ref")
          if [ -n "$advertised" ]; then
            git fetch --no-tags origin "$remote_ref"
            if [ "$(git rev-parse "FETCH_HEAD^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ] \
              || [ "$(git rev-parse "FETCH_HEAD^")" != "$base" ]; then
              echo "::error::Existing release branch differs. Check the open PR and retire the stale branch."
              exit 1
            fi
            candidate=$(git rev-parse FETCH_HEAD)
          else
            git push origin "HEAD:$remote_ref"
            candidate=$(git rev-parse HEAD)
          fi

          # Updating or rebasing the PR changes its SHA and invalidates this qualification.
          qualification_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_NUMBER"
          status=$(jq -n --arg url "$qualification_url" \
            '{state:"success",context:"Release / Qualified candidate",target_url:$url,description:"Exact release tree qualified"}')
          forge -H 'Content-Type: application/json' \
            --data "$status" "$api/statuses/$candidate" >/dev/null

          echo "Qualified release commit: $candidate"

          pull_issues=$(forge --get \
            --data-urlencode 'state=open' --data-urlencode "head=$branch" \
            --data-urlencode 'page=1' --data-urlencode 'limit=50' "$api/pulls")
          existing=$(jq -c --arg branch "$branch" --arg repo "$GITHUB_REPOSITORY" --arg base "$CHANNEL" \
            '.[] | select(.head.label == $branch and .head.repo.full_name == $repo and .base.ref == $base)' \
            <<< "$pull_issues")
          if [ -n "$existing" ]; then
            jq -e --arg prefix "Closes #$ISSUE." --arg branch "$branch" --arg sha "$candidate" \
              '.flow == 0 and .head.ref == $branch and .head.sha == $sha and (.body | startswith($prefix))' \
              <<< "$existing" >/dev/null \
              || { echo "::error::Existing release PR points to a different candidate or issue"; exit 1; }
            jq -er '.html_url' <<< "$existing"
            exit 0
          fi
          body=$(printf 'Closes #%s. The prepared release passed qualification.\n\nNo tests: %s\n' \
            "$ISSUE" 'The workflow replays the exact changelog and image-reference edits that passed qualification.')
          payload=$(jq -n --arg head "$branch" --arg title "Release $TAG" --arg body "$body" --arg base "$CHANNEL" \
            '{head:$head,base:$base,title:$title,body:$body}')
          forge -H 'Content-Type: application/json' \
            --data "$payload" "$api/pulls" | jq -er '.html_url'
