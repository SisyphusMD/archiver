name: CI / Build / Publish

on:
  # PRs gate quality before merge; tag pushes drive the publish flow. Plain
  # commits to main are not a trigger: release.yml is the only path that lands
  # on main directly (release commit + tag), and it runs its own smoke test
  # before tagging — re-validating on the release commit would be redundant.
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: sisyphusmd/archiver

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        # Pinned koalaman/shellcheck image; Renovate (github-actions manager)
        # tracks both tag and digest. warning+ severity only — info-level
        # noise (SC2012, SC2086 in vetted contexts) is intentionally allowed.
        uses: docker://koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        with:
          args: >-
            --severity=warning
            --shell=bash
            .forgejo/scripts/next-version.sh
            lib/host/archiver
            .forgejo/scripts/registry-auth.sh

  validate-changelog:
    name: Validate CHANGELOG structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint CHANGELOG
        run: |
          set -euo pipefail
          # Required: an [Unreleased] section as the release workflow's promotion anchor.
          if ! grep -qE '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Missing required '## [Unreleased]' section"
            exit 1
          fi
          # Required: every '## [' heading is preceded by a blank line (or is line 1).
          # The release workflow's awk pass and create-release's body extraction both
          # assume this structure.
          awk '
            NR > 1 && /^## \[/ && prev != "" {
              print "::error file=CHANGELOG.md,line=" NR "::Heading must be preceded by a blank line: " $0
              failed = 1
            }
            { prev = $0 }
            END { exit (failed ? 1 : 0) }
          ' CHANGELOG.md

  dockerfile-downloads:
    name: Dockerfile download integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every download is checksum-verified
        run: bash tests/lint/dockerfile-downloads.sh

  bats:
    name: Bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        # git is added because tests/next_version.bats builds throwaway repos. The tree is
        # piped in: runner workspace bind mounts land empty in sibling containers.
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=bats/bats
          BATS_IMAGE=bats/bats:1.14.0@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f
          tar -c . | docker run --rm -i --entrypoint sh "$BATS_IMAGE" -c \
            'apk add --no-cache git >/dev/null && mkdir /w && cd /w && tar -x && bats --print-output-on-failure tests'

  go:
    name: Go vet, format, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gofmt, go vet, go test -race
        # The tree is piped in: runner workspace bind mounts land empty in sibling containers.
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=golang
          GO_IMAGE=golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d
          tar -c . | docker run --rm -i -e GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct --entrypoint sh "$GO_IMAGE" -c \
            'mkdir /w && cd /w && tar -x && test -z "$(gofmt -l cmd internal tests/e2e)" && go vet ./... && go test -race -cover ./cmd/... ./internal/...'
      - name: golangci-lint (ADR 39)
        # staticcheck, errcheck, ineffassign, unused, gosec, as .golangci.yml sets them; any
        # finding fails the change. Coverage above is reported per package, with no floor.
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=golangci/golangci-lint
          LINT_IMAGE=golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
          tar -c . | docker run --rm -i -e GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct --entrypoint sh "$LINT_IMAGE" -c \
            'mkdir /w && cd /w && tar -x && golangci-lint run ./...'

  fuzz:
    name: Fuzz the parsers (30 s each, ADR 39)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every Fuzz target, 30 seconds each
        # Targets are found, not listed: a new one is fuzzed without touching this file. A
        # crash prints its input; add it to that target's seeds as a regression test.
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=golang
          GO_IMAGE=golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d
          tar -c . | docker run --rm -i -e GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct -e FUZZTIME=30s --entrypoint sh "$GO_IMAGE" -c \
            'mkdir /w && cd /w && tar -x && sh tests/fuzz.sh'

  pr-validate:
    name: PR build & smoke test
    if: github.event_name == 'pull_request'
    needs: [shellcheck, validate-changelog, dockerfile-downloads, bats]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Dockerfile change (gates the slow arm64 emulation build)
        id: dockerfile
        # arm64 buildability can only break via the Dockerfile (arch-specific
        # downloads: duplicacy/docker-cli) or a base-image/version bump — all of
        # which touch this file. Arch-independent shell changes can't, so skip the
        # ~15-25 min qemu build for them. Fail-safe: if base can't be fetched/diffed,
        # default to changed=true so arm64 is still validated.
        run: |
          set -uo pipefail
          changed=true
          if git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null; then
            if git diff --name-only FETCH_HEAD HEAD -- Dockerfile | grep -q .; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Dockerfile changed vs ${{ github.base_ref }}: ${changed}"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Build amd64 (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-test:local
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      - name: Smoke test (no config exits cleanly; a bundle-era BUNDLE_PASSWORD refuses)
        run: |
          set +e
          # --network none: with no key files the entrypoint exits at the
          # config check before any cloud/SSH call, so deny network access to bound the
          # blast radius of an untrusted PR's Dockerfile.
          OUT=$(docker run --rm --network none smoke-test:local 2>&1)
          RC=$?
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "::error::Container exited 0; expected non-zero (no keys)"
            exit 1
          fi
          if ! echo "$OUT" | grep -q "no RSA key files found"; then
            echo "::error::Expected 'no RSA key files found' in output"
            exit 1
          fi
          # A bundle-era BUNDLE_PASSWORD must refuse with the conversion steps (ADR 22).
          OUT2=$(docker run --rm --network none -e BUNDLE_PASSWORD=x smoke-test:local 2>&1)
          RC2=$?
          echo "$OUT2"
          if [ "$RC2" -eq 0 ]; then
            echo "::error::Container exited 0 with BUNDLE_PASSWORD in env; expected non-zero"
            exit 1
          fi
          if ! echo "$OUT2" | grep -q "no longer reads bundles"; then
            echo "::error::Expected the bundle refusal message"
            exit 1
          fi
          echo "Smoke test passed"
      - name: Validate arm64 build (no push)
        # Only when the Dockerfile changed (see detect step). arm64 is always
        # validated at release time by build-and-push's multi-arch build.
        if: steps.dockerfile.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com

  integration:
    name: Round-trip + scheduler smoke
    needs: [shellcheck, validate-changelog, dockerfile-downloads, bats]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Build amd64 (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: roundtrip:local
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      - name: Backup -> restore round-trip (asserts content + mode + UID/GID preserved)
        # Pipe the script via stdin (bash -s) instead of -v mounting the workspace:
        # the runner-container path differs from the docker host path, so a bind mount
        # would land empty (same reason build-and-push stages the OCI archive via docker cp).
        run: |
          docker run -i --rm --hostname rt-host \
            --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            --entrypoint bash roundtrip:local -s < tests/integration/roundtrip.sh
      - name: The full image holds the tools hooks use (ADR 41)
        run: docker run -i --rm -e SLIM=0 --entrypoint bash roundtrip:local -s < tests/integration/slim-tools.sh
      - name: Env-native round-trip (config from env, secrets+keys from files, no bundle)
        run: |
          docker run -i --rm --hostname en-host \
            --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            --entrypoint bash roundtrip:local -s < tests/integration/env-native.sh
      - name: Restore capability warning (backup-only caps warn; full caps stay quiet)
        run: |
          docker run -i --rm --cap-drop ALL --cap-add DAC_OVERRIDE \
            -e EXPECT_WARN=1 --entrypoint bash roundtrip:local -s < tests/integration/restore-caps.sh
          docker run -i --rm --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            -e EXPECT_WARN=0 --entrypoint bash roundtrip:local -s < tests/integration/restore-caps.sh
      - name: Failed backup is reported (non-zero exit, ERROR logged, no false success)
        run: |
          docker run -i --rm --hostname bf-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/backup-failure.sh
      - name: Stop during backup halts before storage wrap-up (no check/prune after stop)
        run: |
          docker run -i --rm --hostname sp-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/stop-skips-prune.sh
      - name: Stop during a non-final service halts at the service boundary
        run: |
          docker run -i --rm --hostname sn-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/stop-nonfinal.sh
      - name: Copy path (secondary storage receives and restores; copy failure reported)
        run: |
          docker run -i --rm --hostname cp-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/copy-path.sh
      - name: Multi-service (glob expansion, one wrap-up, per-service failure isolation)
        run: |
          docker run -i --rm --hostname ms-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/multi-service.sh
      - name: Lock concurrency (busy refused, stale lock recovered and re-held)
        run: |
          docker run -i --rm --hostname lc-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/lock-concurrency.sh
      - name: Pause freezes duplicacy, resume completes, stop-while-paused kills
        run: |
          docker run -i --rm --hostname pr-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/pause-resume.sh
      - name: Healthcheck (env-native healthy, finished-with-errors warns, crash unhealthy)
        run: |
          docker run -i --rm --hostname hc-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/healthcheck.sh
      - name: Restore extras (revision pinning, ignore-ownership, restore-service hook)
        run: |
          docker run -i --rm --hostname re-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/restore-extras.sh
      - name: Restore commands (snapshot-exists, auto-restore fallback/codes, auto-restore-all, post-restore, restored-settings migration)
        run: |
          docker run -i --rm --hostname rc-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/restore-commands.sh
      - name: Restore drills restore, verify and rotate; a damaged chunk fails one (ADR 28)
        run: |
          docker run -i --rm --hostname rd-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/restore-drill.sh
      - name: archiver doctor passes a healthy deployment, writes nothing, and finds what is broken (ADR 30)
        run: |
          docker run -i --rm --hostname dr-host --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            --entrypoint bash roundtrip:local -s < tests/integration/doctor.sh
      - name: Restore preview (DRY_RUN) changes nothing; RESTORE_PATHS restores only what it names (ADR 29)
        run: |
          docker run -i --rm --hostname rp-host --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            --entrypoint bash roundtrip:local -s < tests/integration/restore-preview.sh
      - name: archiver recover rebuilds a lost host from the kit alone (ADR 29)
        run: |
          docker run -i --rm --hostname rc-host --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            --entrypoint bash roundtrip:local -s < tests/integration/recover.sh
      - name: "Fault injection: corrupted chunks are named by check, fail drills and restores; intact revisions restore (ADR 31)"
        run: |
          docker run -i --rm --hostname fc-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/fault-corruption.sh
      - name: "Fault injection: duplicacy, a hook, archiver and a copy killed; locks freed, the next run proceeds (ADR 31)"
        run: |
          docker run -i --rm --hostname fk-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/fault-kill.sh
      - name: Interrupted runs resume, with the post hook run and duplicacy's resume point used (ADR 46)
        run: |
          docker run -i --rm --hostname fi-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/fault-interrupt.sh
      - name: Notifications are one per incident, repeat on ALERT_REPEAT_INTERVAL and announce recovery (ADRs 33, 36)
        run: |
          docker run -i --rm --hostname ic-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/incidents.sh
      - name: Backup health is OK, DEGRADED or FAILING from what each part records; liveness unaffected (ADR 32)
        run: |
          docker run -i --rm --hostname bh-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/backup-health.sh
      - name: A primary down fails at once with one PRIMARY DOWN and starts no service; an unreachable secondary is skipped (ADR 34)
        run: |
          docker run -i --rm --hostname pd-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/primary-down.sh
      - name: Metrics textfile after each backup, kept by the daemon, /metrics on METRICS_PORT (ADR 35)
        run: |
          docker run -i --rm --hostname mx-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/metrics.sh
      - name: Check-ins ping CHECKIN_URL and each target's URL, with fail variants (ADR 37)
        run: |
          docker run -i --rm --hostname ck-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/checkins.sh
      - name: Upload limits reach duplicacy; copy windows skip inline copies and hold workers (ADR 44)
        run: |
          docker run -i --rm --hostname bw-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/bandwidth.sh
      - name: Read-only status page on WEB_PORT, refused writes, startup warning (ADR 38)
        run: |
          docker run -i --rm --hostname wb-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/web.sh
      - name: init emits env-native materials that drive a backup
        run: |
          docker run -i --rm --hostname in-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/init-envnative.sh
      - name: Recovery-kit lifecycle (produce/decrypt/manifest/change-detect/force/prune-safe)
        run: |
          docker run -i --rm --hostname rk-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/recovery-kit.sh
      - name: Maintenance pipeline (check/prune split, exhaustive frequency, lock waits, stop)
        run: |
          docker run -i --rm --hostname mt-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/maintenance.sh
      - name: Hook exit codes count (failed pre hook skips its service; post hook still runs)
        run: |
          docker run -i --rm --hostname hf-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/hook-failures.sh
      - name: Only hooks nobody else can change run; Duplicacy scripts never run (ADR 45)
        run: |
          docker run -i --rm --hostname hs-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/hook-safety.sh
      - name: No storage secrets written into the backed-up data
        run: |
          docker run -i --rm --hostname sr-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/secrets-at-rest.sh
      - name: Unbackupable SERVICE_DIRECTORIES entries are errors
        run: |
          docker run -i --rm --hostname sd-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/service-dirs-reported.sh
      - name: Hook migration (legacy settings become executable hooks the Go pipeline runs)
        run: |
          docker run -i --rm --hostname mh-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/migrate-hooks.sh
      - name: Copy workers (handed-off copies, retry without failing the backup, stop/pause/resume)
        run: |
          docker run -i --rm --hostname cw-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/copy-workers.sh
      - name: Failed commands exit non-zero through the archiver dispatcher
        run: |
          docker run -i --rm --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/dispatch-exit-codes.sh
      - name: Local prune leaves revisions in use (ADR 19)
        run: |
          docker run -i --rm --hostname pu-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/prune-in-use.sh
      - name: Break-glass envelope and kit extras
        run: |
          docker run -i --rm --hostname ev-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/envelope.sh
      - name: Hook tools are in the image (btrfs, python3 + lmdb)
        run: |
          docker run -i --rm --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/hook-tools.sh
      - name: Pause reaches a hook's own programs and holds the next program
        run: |
          docker run -i --rm --hostname pt-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/pause-tree.sh
      - name: Stop on the Go pipeline (inline copies end without retry or kit step)
        run: |
          docker run -i --rm --hostname sg-host --cap-drop ALL --cap-add DAC_OVERRIDE \
            --entrypoint bash roundtrip:local -s < tests/integration/stop-go.sh
      - name: Scheduler smoke test (the daemon fires a job without SETGID)
        # Same hardened cap set as the round-trip, minus SETGID — proves the scheduler
        # runs scheduled jobs without the capability Phase 2 removed.
        run: |
          docker run -i --rm \
            --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
            --entrypoint bash roundtrip:local -s < tests/integration/scheduler.sh

  slim:
    name: Slim image (ADR 41)
    needs: [shellcheck, validate-changelog, dockerfile-downloads, bats]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
      - name: Build the slim target, amd64 (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          target: slim
          load: true
          tags: slim:local
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      - name: Everything Archiver runs, none of the hook tools
        run: docker run -i --rm -e SLIM=1 --entrypoint bash slim:local -s < tests/integration/slim-tools.sh
      - name: Backup, restore, recovery kit, envelope, maintenance and recovery on the slim image
        # The integration scripts that need nothing only hooks use (no python3, no pgrep).
        run: |
          set -euo pipefail
          for t in roundtrip:rt-host recovery-kit:rk-host envelope:ev-host restore-commands:rc-host maintenance:mt-host recover:rc-host; do
            echo "=== ${t%%:*}"
            docker run -i --rm --hostname "${t##*:}" --cap-drop ALL --cap-add DAC_OVERRIDE --cap-add CHOWN --cap-add FOWNER \
              --entrypoint bash slim:local -s < "tests/integration/${t%%:*}.sh"
          done

  integration-host:
    name: Host-driven integration (entrypoint + storage sidecars)
    needs: [shellcheck, validate-changelog, dockerfile-downloads, bats]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Build amd64 (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hosttests:local
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      # These drive the REAL entrypoint container (docker run/stop/exec) or storage
      # sidecars on a docker network, so they run on the host rather than via
      # --entrypoint bash. Secrets reach containers through named volumes: runner
      # workspace bind mounts land empty (same reason the tests above pipe via stdin).
      - name: docker stop during a backup stops gracefully (SIGTERM, no prune, exit 0)
        run: IMAGE=hosttests:local bash tests/integration/sigterm-stop.sh
      - name: Podman parity, socket hooks through Podman's API and the host-side command (ADR 5)
        run: IMAGE=hosttests:local bash tests/integration/podman.sh
      - name: Malformed BACKUP_SCHEDULE fails the container fast
        run: IMAGE=hosttests:local bash tests/integration/invalid-cron.sh
      - name: LOG_FORMAT=json makes every docker logs line JSON
        run: IMAGE=hosttests:local bash tests/integration/json-logs.sh
      - name: s3 runtime against Garage (backup + restore over the s3 wire, TLS)
        run: IMAGE=hosttests:local bash tests/integration/s3-garage.sh
      - name: sftp runtime against sshd (backup + restore over ssh)
        run: IMAGE=hosttests:local bash tests/integration/sftp-runtime.sh
      - name: "Fault injection: full storage, logs and restore target fail loudly and recover (ADR 31)"
        run: IMAGE=hosttests:local bash tests/integration/fault-disk.sh
      - name: "Fault injection: a slowed and cut storage link mid-backup and mid-copy (ADR 31)"
        run: IMAGE=hosttests:local bash tests/integration/fault-network.sh
      - name: Every emulated storage type round-trips (backup, kit, restore; ADRs 23, 25)
        run: IMAGE=hosttests:local bash tests/integration/backends.sh
      - name: Bundle-era inputs refuse with the 0.11 conversion (ADRs 4, 22)
        run: IMAGE=hosttests:local bash tests/integration/refuse-bundle.sh
      - name: Legacy settings files refuse start; migrate hooks runs as the command (ADR 20)
        run: IMAGE=hosttests:local bash tests/integration/refuse-legacy.sh

  e2e:
    name: Black-box suite (never-break across versions)
    needs: [shellcheck, validate-changelog, dockerfile-downloads, bats]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Build amd64 (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: e2e:local
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      - name: Go black-box tests (upgrade from the last bash release, restore, rollback, recovery kit)
        env:
          GOPROXY: https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
        run: ARCHIVER_IMAGE=e2e:local bash tests/e2e/run.sh -v

  build-and-push:
    name: Build multi-arch and push (${{ matrix.variant }})
    if: startsWith(github.ref, 'refs/tags/v')
    # ADR 41: the full image (every tool hooks may use) and the slim one, built, signed and
    # released alike; slim's tags carry -slim.
    # One at a time: both upload the same layers to one repository, which races Forgejo's
    # blob uniqueness check (see the skopeo notes below), and both run the NAS sync.
    strategy:
      max-parallel: 1
      matrix:
        variant: [full, slim]
    needs: [shellcheck, validate-changelog, dockerfile-downloads, bats, go, fuzz, integration, slim, integration-host, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Matrix legs share these outputs and the last one to set an output wins, so each is set
    # only on failure: a leg whose mirror worked cannot overwrite the other's failure.
    outputs:
      mirror-nas: ${{ steps.mirror-report.outputs.nas }}
      mirror-ghcr: ${{ steps.mirror-report.outputs.ghcr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version refs match tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # A prerelease leaves the documented image on the newest stable release (ADR 9).
          case "$VERSION" in
            *-*) echo "Prerelease ${VERSION}: version refs stay on stable"; exit 0 ;;
          esac
          EXPECTED="forgejo.bryantserver.com/sisyphusmd/archiver:${VERSION}"
          if ! grep -qF "$EXPECTED" compose.yaml; then
            echo "::error::compose.yaml does not contain ${EXPECTED}. Manual tags must bump compose.yaml first."
            exit 1
          fi
          if ! grep -qF "$EXPECTED" README.md; then
            echo "::error::README.md does not contain ${EXPECTED}. Manual tags must bump README.md first."
            exit 1
          fi

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]

      - name: Log in to cluster Forgejo registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: forgejo.bryantserver.com
          username: cody
          password: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: forgejo.bryantserver.com/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'slim' && '-slim' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Build to a local OCI archive instead of pushing directly. Forgejo
      # 15.0.1 nil-derefs in EndUploadBlob when buildx's parallel multi-arch
      # push hits the `UQE_package_blob_blake2b` (or sha512) unique constraint
      # — byte-identical blobs across amd64/arm64 (e.g. arch-independent COPY
      # layers) race two PUTs of the same digest. Same root cause as the NAS
      # mirror bug the next steps work around.
      #
      # `cache-to: type=inline` embeds the cache annotations on the manifest
      # itself, so subsequent builds can `cache-from` the published image
      # without a separate cache push (which would re-trigger the same bug).
      # Cache miss on first build of a new minor is non-fatal — buildkit
      # logs a warning and proceeds with a full build.
      - name: Build (multi-arch, OCI archive output)
        id: build
        # ADR 40: attestations never fail a release: without them, the next step builds again.
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.variant }}
          push: false
          outputs: type=oci,dest=${{ github.workspace }}/image.tar
          labels: ${{ steps.meta.outputs.labels }}
          # ADR 40: an SBOM and a provenance attestation in every published image; neither
          # can fail the build.
          sbom: true
          provenance: mode=max
          # Moving major tag (metadata-action's {{major}} pattern) so the cache ref stays
          # current across minor releases without a manual bump. Cache miss is non-fatal.
          cache-from: |
            type=registry,ref=forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:0
            type=registry,ref=forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:0-slim
          cache-to: type=inline
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com
      - name: Warn that the release carries no attestations
        if: steps.build.outcome == 'failure'
        run: echo "::warning title=No SBOM or provenance::The attested build failed; this release was built without them."
      - name: Build without attestations (the attested build failed)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.variant }}
          push: false
          outputs: type=oci,dest=${{ github.workspace }}/image.tar
          labels: ${{ steps.meta.outputs.labels }}
          sbom: false
          provenance: false
          # Moving major tag (metadata-action's {{major}} pattern) so the cache ref stays
          # current across minor releases without a manual bump. Cache miss is non-fatal.
          cache-from: |
            type=registry,ref=forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:0
            type=registry,ref=forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:0-slim
          cache-to: type=inline
          build-args: |
            GOPROXY=https://artifacts.lan.bryantserver.com/proxy.golang.org,direct
            DEBIAN_MIRROR=http://artifacts.lan.bryantserver.com/deb.debian.org
            GITHUB_MIRROR=https://artifacts.lan.bryantserver.com/github.com
            DOCKER_DOWNLOAD_MIRROR=https://artifacts.lan.bryantserver.com/download.docker.com

      # Skopeo walks the OCI index manifests serially and `TryReusingBlob`-
      # checks each layer at the destination before PUT, so byte-identical
      # blobs across arches dedupe cleanly: amd64 pushes its copy, arm64
      # finds the blob present, skips the PUT, no SQL conflict.
      #
      # The OCI archive lives in the runner-container's workspace, but
      # bind-mounting it into a child container fails in DinD: the docker
      # daemon (on the host) doesn't see the runner's view of the workspace
      # path, so `-v <archive>:<target>` silently creates an empty dir at
      # the host path and the mount lands as an empty dir inside skopeo.
      # Stage the archive into a docker-managed named volume via
      # `docker cp` — it streams over the docker socket and named volumes
      # don't require host path translation.
      # Pushed to one candidate tag first: the release tags are set only once its digest is
      # signed (ADR 40), so no release tag ever names an unsigned image.
      - name: Push the candidate to cluster Forgejo via skopeo
        id: push
        env:
          REGISTRY_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          META_TAGS: forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:release-candidate${{ matrix.variant == 'slim' && '-slim' || '' }}
          IMAGE_TAR: ${{ github.workspace }}/image.tar
        run: |
          set -euo pipefail
          # Pulled through the NAS zot mirror, which keeps every quay.io/skopeo digest it has
          # served (nas services/image-mirror retention). quay garbage-collects a tag's old
          # digest when it re-pushes the tag, so a direct pin 404s before Renovate bumps it.
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:e5d5d2815b94d74767d40be7111647c3e9cdc84406a638ffe1c7ea1f286f52a3

          VOL=skopeo-stage-${{ github.run_id }}-${{ matrix.variant }}
          AUTH=skopeo-auth-push-${{ github.run_id }}-${{ matrix.variant }}
          docker volume create "$VOL" >/dev/null
          trap 'docker volume rm -f "$VOL" "$AUTH" >/dev/null 2>&1' EXIT
          bash .forgejo/scripts/registry-auth.sh "$AUTH" "$SKOPEO_IMAGE" forgejo.bryantserver.com=cody:REGISTRY_PAT

          STAGE=$(docker create -v "$VOL":/data "$SKOPEO_IMAGE")
          docker cp "${IMAGE_TAR}" "${STAGE}:/data/image.tar"
          docker rm "${STAGE}" >/dev/null

          while IFS= read -r dst; do
            [ -z "$dst" ] && continue
            docker run --rm \
              -v "$VOL":/data -v "$AUTH":/auth:ro \
              "$SKOPEO_IMAGE" \
              copy --all --digestfile /data/digest \
                --dest-authfile /auth/auth.json \
                oci-archive:/data/image.tar \
                "docker://${dst}"
          done <<< "$META_TAGS"
          # The digest of exactly what this run pushed: the candidate tag may be moved by
          # another release run before this one signs.
          digest=$(docker run --rm -v "$VOL":/data --entrypoint cat "$SKOPEO_IMAGE" /data/digest)
          case "$digest" in sha256:*) ;; *) echo "::error::no digest recorded for the candidate"; exit 1;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # ADR 40: the release is signed before it is mirrored or announced. A failed signature
      # fails this job, so the mirrors and the release notes never carry an unsigned image.
      # No transparency log: the signature lives beside the image in the registry, and
      # cosign.pub in the repository verifies it.
      - name: Sign the release (cosign)
        id: sign
        env:
          REGISTRY_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CANDIDATE: forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:release-candidate${{ matrix.variant == 'slim' && '-slim' || '' }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$COSIGN_PASSWORD" ] || { echo "::error::COSIGN_PRIVATE_KEY or COSIGN_PASSWORD is not set; not releasing unsigned"; exit 1; }
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:e5d5d2815b94d74767d40be7111647c3e9cdc84406a638ffe1c7ea1f286f52a3
          # renovate: datasource=docker depName=ghcr.io/sigstore/cosign/cosign
          COSIGN_IMAGE=ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00
          repo="${CANDIDATE%:*}"
          digest="$DIGEST"
          # The registry login goes in through a volume's config.json, never cosign's argv.
          AUTH=cosign-auth-${{ github.run_id }}-${{ matrix.variant }}
          docker volume create "$AUTH" >/dev/null
          trap 'docker volume rm -f "$AUTH" >/dev/null 2>&1' EXIT
          docker run --rm -e REGISTRY_PAT -v "$AUTH":/cfg --entrypoint sh "$SKOPEO_IMAGE" -c \
            'printf "{\"auths\":{\"forgejo.bryantserver.com\":{\"auth\":\"%s\"}}}" "$(printf "cody:%s" "$REGISTRY_PAT" | base64 -w0)" > /cfg/config.json'
          docker run --rm -v "$AUTH":/cfg -e DOCKER_CONFIG=/cfg -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD "$COSIGN_IMAGE" \
            sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false "${repo}@${digest}"
          docker run --rm -v "$AUTH":/cfg -e DOCKER_CONFIG=/cfg -e COSIGN_PUBLIC_KEY="$(cat cosign.pub)" "$COSIGN_IMAGE" \
            verify --key env://COSIGN_PUBLIC_KEY --insecure-ignore-tlog=true "${repo}@${digest}" >/dev/null
          echo "Signed and verified ${repo}@${digest}"
          echo "sig_tag=sha256-${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "signed=${repo}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Tag the signed release
        env:
          REGISTRY_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          # By digest, not the candidate tag: another release run may have moved that tag
          # since this one signed.
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:e5d5d2815b94d74767d40be7111647c3e9cdc84406a638ffe1c7ea1f286f52a3
          AUTH=skopeo-auth-tag-${{ github.run_id }}-${{ matrix.variant }}
          trap 'docker volume rm -f "$AUTH" >/dev/null 2>&1' EXIT
          bash .forgejo/scripts/registry-auth.sh "$AUTH" "$SKOPEO_IMAGE" forgejo.bryantserver.com=cody:REGISTRY_PAT
          while IFS= read -r dst; do
            [ -z "$dst" ] && continue
            docker run --rm -v "$AUTH":/auth:ro "$SKOPEO_IMAGE" \
              copy --all --src-authfile /auth/auth.json --dest-authfile /auth/auth.json "docker://${SIGNED}" "docker://${dst}"
          done <<< "$META_TAGS"

      # ADR 40: known vulnerabilities reported for each release, never blocking it (most
      # come from Debian packages with no fix available).
      - name: Scan the release (trivy, advisory)
        continue-on-error: true
        env:
          TRIVY_USERNAME: cody
          TRIVY_PASSWORD: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=aquasec/trivy
          TRIVY_IMAGE=aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          first=$(printf '%s\n' "$META_TAGS" | head -1)
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --no-progress "$first"

      # Full repo sync, not per-tag copy. NAS is the canonical mirror of the
      # cluster registry — DR depends on it being complete. `skopeo sync` walks
      # every tag at the source, skips ones the dest already has matching, and
      # uploads only what's missing or drifted. Cheap when in sync (~100ms
      # manifest check per tag), self-healing if a previous mirror dropped a
      # tag silently.
      - name: Mirror full repo to NAS Forgejo
        id: mirror-nas
        continue-on-error: true
        env:
          SRC: forgejo.bryantserver.com/${{ env.IMAGE_NAME }}
          DST_NAMESPACE: forgejo.lan.bryantserver.com/sisyphusmd
          SRC_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          DST_PAT: ${{ secrets.NAS_FORGEJO_REGISTRY_PUSH_PAT }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:e5d5d2815b94d74767d40be7111647c3e9cdc84406a638ffe1c7ea1f286f52a3
          AUTH=skopeo-auth-nas-${{ github.run_id }}-${{ matrix.variant }}
          trap 'docker volume rm -f "$AUTH" >/dev/null 2>&1' EXIT
          bash .forgejo/scripts/registry-auth.sh "$AUTH" "$SKOPEO_IMAGE" forgejo.bryantserver.com=cody:SRC_PAT "${DST_NAMESPACE%%/*}=cody:DST_PAT"
          docker run --rm \
            -v "$AUTH":/auth:ro \
            "$SKOPEO_IMAGE" \
            sync --all --keep-going \
              --src docker --dest docker \
              --src-authfile /auth/auth.json \
              --dest-authfile /auth/auth.json \
              "$SRC" "$DST_NAMESPACE"

      # GHCR mirror via per-tag `skopeo copy`. `skopeo sync` would also work
      # but copy is per-tag explicit, matching the meta-action tag list and
      # keeping the GHCR namespace from accumulating any drift from other
      # tags that might end up on cluster Forgejo (e.g. historical short
      # SHAs from prior workflows). For a public mirror, less surface area
      # is a feature.
      - name: Mirror to GitHub Container Registry via skopeo (per tag)
        id: mirror-ghcr
        continue-on-error: true
        env:
          SRC_PAT: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
          DST_PAT: ${{ secrets.GH_REGISTRY_PUSH_PAT }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=quay.io/skopeo/stable
          SKOPEO_IMAGE=image-mirror.lan.bryantserver.com/quay.io/skopeo/stable:v1.22.3@sha256:e5d5d2815b94d74767d40be7111647c3e9cdc84406a638ffe1c7ea1f286f52a3
          AUTH=skopeo-auth-ghcr-${{ github.run_id }}-${{ matrix.variant }}
          trap 'docker volume rm -f "$AUTH" >/dev/null 2>&1' EXIT
          bash .forgejo/scripts/registry-auth.sh "$AUTH" "$SKOPEO_IMAGE" forgejo.bryantserver.com=cody:SRC_PAT "ghcr.io=${{ github.repository_owner }}:DST_PAT"
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            dst="${src/forgejo.bryantserver.com/ghcr.io}"
            docker run --rm \
              -v "$AUTH":/auth:ro \
              "$SKOPEO_IMAGE" \
              copy --all \
                --src-authfile /auth/auth.json \
                --dest-authfile /auth/auth.json \
                "docker://${src}" "docker://${dst}"
          done <<< "$META_TAGS"
          # The signature (ADR 40) travels with the image.
          sig="forgejo.bryantserver.com/${{ env.IMAGE_NAME }}:${{ steps.sign.outputs.sig_tag }}"
          docker run --rm \
            -v "$AUTH":/auth:ro \
            "$SKOPEO_IMAGE" \
            copy --all \
              --src-authfile /auth/auth.json \
              --dest-authfile /auth/auth.json \
              "docker://${sig}" "docker://${sig/forgejo.bryantserver.com/ghcr.io}"

      # Surface mirror failures as warnings only; do NOT exit 1 here. Failing
      # this job would skip create-release via `needs:`, blocking the very
      # release notes the user wants regardless of mirror health. The summary
      # job at the end of the workflow rolls outcomes up and turns the run
      # red so failures still surface in the runs list.
      - name: Report mirror results
        id: mirror-report
        if: always()
        env:
          NAS_OUTCOME: ${{ steps.mirror-nas.outcome }}
          GHCR_OUTCOME: ${{ steps.mirror-ghcr.outcome }}
        run: |
          if [ "$NAS_OUTCOME" = "failure" ]; then
            echo "::warning title=NAS Forgejo mirror failed::Push to forgejo.lan.bryantserver.com failed"
            echo "nas=failure" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GHCR_OUTCOME" = "failure" ]; then
            echo "::warning title=GHCR mirror failed::Push to ghcr.io failed"
            echo "ghcr=failure" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Reconcile releases across registries
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      forgejo-failures: ${{ steps.reconcile.outputs.cluster-failures }}
      nas-failures: ${{ steps.reconcile.outputs.nas-failures }}
      github-failures: ${{ steps.reconcile.outputs.github-failures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all tags needed for reconciliation loop

      # Walks every v* tag and reconciles releases on cluster Forgejo, NAS
      # Forgejo, and GitHub. Same self-healing pattern as the skopeo sync
      # mirror step: a release that failed to create on a prior run is
      # picked up by the next successful release run. Each tagged release
      # retroactively heals every gap since the project began.
      #
      # Uses real-user PATs (not the auto-injected GITHUB_TOKEN). The
      # ephemeral runner token works for the API call but attributes the
      # resulting release to "ghost" in the UI; the cody-owned PATs surface
      # the release authored by them.
      - name: Reconcile all releases on cluster Forgejo, NAS Forgejo, and GitHub
        id: reconcile
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          CLUSTER_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          NAS_API: https://forgejo.lan.bryantserver.com/api/v1/repos/${{ github.repository }}/releases
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          GH_API: https://api.github.com/repos/${{ github.repository }}/releases
        run: |
          set -uo pipefail
          AUTH_HEADER_FILE=$(mktemp)
          trap 'rm -f "$AUTH_HEADER_FILE"' EXIT

          # Write a release payload, retrying the transient rejections. On failure
          # API_WRITE_ERROR carries the status and a slice of the response body:
          # the previous `curl -f ... >/dev/null` discarded both, so a failed
          # reconcile printed a bare "FAILED" and could not be diagnosed afterwards
          # (15 GitHub releases failed for months with no recoverable reason).
          api_write() {
            local method=$1 url=$2 auth_header=$3 payload_file=$4
            local attempt http delay hinted
            API_WRITE_ERROR=""
            for attempt in 1 2 3; do
              http=$(curl -sSL -o /tmp/write-response.json -D /tmp/write-headers.txt -w "%{http_code}" \
                -X "${method}" \
                -H "${auth_header}" \
                -H "Content-Type: application/json" \
                -d @"${payload_file}" \
                "${url}")
              case "${http}" in
                2??) return 0 ;;
                429|5??) ;;
                # GitHub answers its secondary rate limit with 403; a genuine
                # permission failure wears the same status and is not retryable.
                403)
                  grep -qiE 'secondary rate limit|abuse detection' /tmp/write-response.json || break
                  ;;
                *) break ;;
              esac
              if [ "${attempt}" -lt 3 ]; then
                # Prefer the server's own backoff: retrying inside a rate-limit window
                # can extend the block, and the delays GitHub asks for are longer than
                # this ladder. Retry-After may also be an HTTP-date, which parses to
                # nonsense, so only a plausible delta is honoured.
                delay=$((attempt * 10))
                hinted=$(grep -i '^retry-after:' /tmp/write-headers.txt | tail -1 | tr -cd '0-9')
                if [ -n "${hinted}" ] && [ "${hinted}" -gt "${delay}" ] && [ "${hinted}" -le 120 ]; then
                  delay="${hinted}"
                fi
                sleep "${delay}"
              fi
            done
            API_WRITE_ERROR="http=${http} body=$(tr -d '\r\n' < /tmp/write-response.json | cut -c1-400)"
            return 1
          }

          # Is the live release already exactly what we would write? The loop
          # revisits every tag on every run, so without this each release rewrote
          # every tag on all three registries — write volume that grows with the tag
          # list, spent re-sending content that last changed when the tag was cut.
          # target_commitish is deliberately not compared: it cannot change for an
          # existing tag, and a host that echoed it in another form (a branch name
          # rather than the sha) would make every release look stale.
          release_matches() {
            local existing=$1 payload=$2
            local live want
            live=$(jq -S '{name, body, draft, prerelease}' "${existing}") || return 1
            want=$(jq -S '{name, body, draft, prerelease}' "${payload}") || return 1
            [ "${live}" = "${want}" ]
          }

          # Reconcile a single release on a single registry. Uses Forgejo
          # auth scheme (`Authorization: token`) by default; pass
          # auth_scheme=bearer for GitHub.
          # POSTs if the release is missing, PATCHes if it exists and differs
          # (keeps the body in sync with the latest CHANGELOG).
          # Returns 0 on success, 1 on failure.
          reconcile_release() {
            local label=$1 api=$2 token=$3 auth_scheme=$4 tag=$5 payload_file=$6
            local http id auth_header

            # The header reaches curl in a private file (-H @file), never on its command
            # line, where another process on the runner could read the token.
            if [ "$auth_scheme" = "bearer" ]; then
              printf 'Authorization: Bearer %s\n' "${token}" > "${AUTH_HEADER_FILE}"
            else
              printf 'Authorization: token %s\n' "${token}" > "${AUTH_HEADER_FILE}"
            fi
            auth_header="@${AUTH_HEADER_FILE}"

            http=$(curl -sSL -o /tmp/existing.json -w "%{http_code}" \
              -H "${auth_header}" \
              "${api}/tags/${tag}")

            if [ "$http" = "200" ]; then
              id=$(jq -r .id /tmp/existing.json)
              if release_matches /tmp/existing.json "${payload_file}"; then
                echo "  [${label}] ${tag} already current (id=${id})"
                return 0
              fi
              if api_write PATCH "${api}/${id}" "${auth_header}" "${payload_file}"; then
                echo "  [${label}] ${tag} updated (id=${id})"
                return 0
              fi
              echo "  [${label}] ${tag} update FAILED ${API_WRITE_ERROR}" >&2
              return 1
            elif [ "$http" = "404" ]; then
              if api_write POST "${api}" "${auth_header}" "${payload_file}"; then
                echo "  [${label}] ${tag} created"
                return 0
              fi
              # A create is not idempotent: a 5xx returned after the host already
              # committed the release turns the retry into a 409/422, which would be
              # reported as a failure even though the release now exists and is right.
              http=$(curl -sSL -o /tmp/existing.json -w "%{http_code}" \
                -H "${auth_header}" \
                "${api}/tags/${tag}")
              if [ "$http" = "200" ] && release_matches /tmp/existing.json "${payload_file}"; then
                echo "  [${label}] ${tag} created (confirmed after a retried create)"
                return 0
              fi
              echo "  [${label}] ${tag} create FAILED ${API_WRITE_ERROR}" >&2
              return 1
            else
              echo "  [${label}] ${tag} unexpected HTTP ${http} body=$(tr -d '\r\n' < /tmp/existing.json | cut -c1-400)" >&2
              return 1
            fi
          }

          cluster_failures=0
          nas_failures=0
          github_failures=0

          for tag in $(git tag -l 'v*.*.*' --sort=-v:refname); do
            version="${tag#v}"
            # `^{}` dereferences annotated tags to their underlying commit;
            # lightweight tags resolve to the commit directly (no-op).
            commit_sha=$(git rev-parse "${tag}^{}")

            HEADER=$(grep -E "^## \[${version}\]" CHANGELOG.md | head -n1 || true)
            if [ -z "$HEADER" ]; then
              echo "::warning::No CHANGELOG entry for ${version}; skipping ${tag}"
              continue
            fi

            HEADLINE=$(printf '%s\n' "$HEADER" | sed -nE 's/^## \[[^]]+\] - [0-9-]+ - (.+)$/\1/p')
            if [ -n "$HEADLINE" ]; then
              NAME="${tag} - ${HEADLINE}"
            else
              NAME="${tag}"
            fi

            # Escape regex metacharacters in version (the dots) before passing to awk.
            V_RE=$(printf '%s' "${version}" | sed 's/\./\\./g')
            BODY=$(awk -v v="${V_RE}" '
              $0 ~ "^## \\[" v "\\]" { in_section=1; next }
              in_section && /^## \[/ { exit }
              in_section && started { print }
              in_section && /[^[:space:]]/ && !started { started=1; print }
            ' CHANGELOG.md)

            if [ -z "$BODY" ]; then
              BODY="See CHANGELOG.md for details."
            fi

            PRERELEASE=false
            case "$version" in *-*) PRERELEASE=true ;; esac

            jq -n \
              --arg tag "$tag" \
              --arg name "$NAME" \
              --arg body "$BODY" \
              --arg sha "$commit_sha" \
              --argjson prerelease "$PRERELEASE" \
              '{tag_name:$tag, name:$name, body:$body, target_commitish:$sha, draft:false, prerelease:$prerelease}' \
              > /tmp/release-payload.json

            echo "::group::Reconciling ${tag}"
            reconcile_release "cluster" "$CLUSTER_API" "$CLUSTER_TOKEN" "token"  "$tag" /tmp/release-payload.json \
              || cluster_failures=$((cluster_failures + 1))
            reconcile_release "nas"     "$NAS_API"     "$NAS_TOKEN"     "token"  "$tag" /tmp/release-payload.json \
              || nas_failures=$((nas_failures + 1))
            reconcile_release "github"  "$GH_API"      "$GH_TOKEN"      "bearer" "$tag" /tmp/release-payload.json \
              || github_failures=$((github_failures + 1))
            echo "::endgroup::"
          done

          echo "Reconciliation: cluster_failures=${cluster_failures} nas_failures=${nas_failures} github_failures=${github_failures}"
          echo "cluster-failures=${cluster_failures}" >> "$GITHUB_OUTPUT"
          echo "nas-failures=${nas_failures}" >> "$GITHUB_OUTPUT"
          echo "github-failures=${github_failures}" >> "$GITHUB_OUTPUT"

          # Don't exit non-zero — the summary job rolls failures up. Exiting
          # here would skip subsequent steps in this job.

      # Warnings only; the summary job rolls them up and fails the run.
      - name: Report reconciliation results
        if: always()
        env:
          CLUSTER_FAILURES: ${{ steps.reconcile.outputs.cluster-failures }}
          NAS_FAILURES: ${{ steps.reconcile.outputs.nas-failures }}
          GITHUB_FAILURES: ${{ steps.reconcile.outputs.github-failures }}
        run: |
          if [ "${CLUSTER_FAILURES:-0}" != "0" ]; then
            echo "::warning title=Cluster Forgejo release failures::${CLUSTER_FAILURES} release(s) failed to reconcile on forgejo.bryantserver.com"
          fi
          if [ "${NAS_FAILURES:-0}" != "0" ]; then
            echo "::warning title=NAS Forgejo release failures::${NAS_FAILURES} release(s) failed to reconcile on forgejo.lan.bryantserver.com"
          fi
          if [ "${GITHUB_FAILURES:-0}" != "0" ]; then
            echo "::warning title=GitHub release failures::${GITHUB_FAILURES} release(s) failed to reconcile on github.com"
          fi

  # Final aggregator: rolls up step outcomes from build-and-push and
  # create-release. Per-job Report steps only warn so they don't block the
  # next job. This job exits 1 if any tracked outcome is 'failure', turning
  # the workflow run red so partial failures surface in the runs list.
  summary:
    name: Workflow summary
    needs: [build-and-push, create-release]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate outcomes
        env:
          BP_RESULT: ${{ needs.build-and-push.result }}
          CR_RESULT: ${{ needs.create-release.result }}
          MIRROR_NAS: ${{ needs.build-and-push.outputs.mirror-nas }}
          MIRROR_GHCR: ${{ needs.build-and-push.outputs.mirror-ghcr }}
          FORGEJO_FAILURES: ${{ needs.create-release.outputs.forgejo-failures }}
          NAS_FAILURES: ${{ needs.create-release.outputs.nas-failures }}
          GITHUB_FAILURES: ${{ needs.create-release.outputs.github-failures }}
        run: |
          set -eu
          echo "Job results:"
          echo "  build-and-push: ${BP_RESULT}"
          echo "  create-release: ${CR_RESULT}"
          echo "Step outcomes:"
          echo "  mirror-nas:        ${MIRROR_NAS:-<n/a>}"
          echo "  mirror-ghcr:       ${MIRROR_GHCR:-<n/a>}"
          echo "  forgejo-failures:  ${FORGEJO_FAILURES:-<n/a>}"
          echo "  nas-failures:      ${NAS_FAILURES:-<n/a>}"
          echo "  github-failures:   ${GITHUB_FAILURES:-<n/a>}"
          failed=0
          # Job-level: success or skipped (skipped == upstream cancellation).
          # Treat anything else as a failure.
          for r in "$BP_RESULT" "$CR_RESULT"; do
            case "$r" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          # Mirror outcomes from the continue-on-error steps.
          [ "$MIRROR_NAS" = "failure" ] && failed=1
          [ "$MIRROR_GHCR" = "failure" ] && failed=1
          # Reconciliation failure counts (>0 means at least one tag failed).
          [ "${FORGEJO_FAILURES:-0}" != "0" ] && failed=1
          [ "${NAS_FAILURES:-0}" != "0" ] && failed=1
          [ "${GITHUB_FAILURES:-0}" != "0" ] && failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more publish targets failed; see warnings above"
            exit 1
          fi
          echo "All publish targets succeeded"
